# =============================================================================
# terraform.yml — validate / plan / dispatch-gated apply for sbx-rds-postgres
# =============================================================================
#
# Pipeline contract:
#   PR open/sync       → validate + plan (PR comment with diff)
#   push to main       → validate + plan ONLY  (NO automatic apply)
#   workflow_dispatch  → apply OR destroy + seed (manual click in Actions UI)
#
# Why workflow_dispatch is the gate (not GitHub Environments):
#   GitHub Environments with `reviewers` are designed for >=2 person teams.
#   Solo-dev sandbox: when the deployer is the only required reviewer, GH
#   auto-approves silently. Setting prevent_self_review=true creates a
#   permanent deadlock (no one can approve). Discovered 2026-05-15 — see
#   memory `github_env_prevent_self_review`.
#
#   Workflow_dispatch sidesteps the issue: triggering apply requires the
#   user to actively click "Run workflow" in the Actions tab AND choose
#   action=apply. That click IS the manual gate. HARD RULE
#   feedback_manual_apply_no_auto_approval honored without env gymnastics.
#
# Auth: GitHub OIDC → IAM role sbx-github-actions (wildcarded to
# repo:dkeeno/sbx-*:*).

name: terraform

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Apply or Destroy
        type: choice
        required: true
        default: apply
        options: [apply, destroy]

permissions:
  contents: read
  id-token: write       # OIDC token for AWS auth
  pull-requests: write  # PR comment with plan output

env:
  TF_VERSION: '1.10.3'
  # AWS_REGION is a repo Variable seeded by bootstrap stack (single source of truth).
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ---------------------------------------------------------------------------
  # validate — runs on every PR and main push
  # ---------------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend — validate-only)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # plan — also runs on every PR and main push, posts to PR
  # ---------------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ github.run_id }}

      - name: Init (real backend)
        run: terraform init

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            tfplan
            plan-output.txt
          retention-days: 14

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan-output.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n\n... (truncated)';
            const body = `### terraform plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exit != '0' && steps.plan.outputs.exit != '2'
        run: exit 1

  # ---------------------------------------------------------------------------
  # apply — push to main (auto-fires plan→apply, gated on env)
  #         OR workflow_dispatch with action=apply
  # ---------------------------------------------------------------------------
  #
  # The `production` GitHub Environment is set up by the bootstrap stack with
  # the user as a required reviewer (HARD RULE feedback_manual_apply_no_auto_approval).
  # Apply pauses on this env until the user clicks "Review deployments → Approve".
  apply:
    name: apply
    runs-on: ubuntu-latest
    # workflow_dispatch with action=apply ONLY. Push-to-main intentionally
    # does NOT auto-apply — see header. The dispatch itself is the gate.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-apply-${{ github.run_id }}

      - name: Init
        run: terraform init

      - name: Apply (fresh plan + apply on dispatch)
        run: terraform apply -auto-approve

      - name: Capture outputs
        run: terraform output -json > terraform-outputs.json

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.run_id }}
          path: terraform-outputs.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # seed — runs after apply on push-to-main. Pushes seed SQL to the bastion
  #        via SSM SendCommand and runs psql against the new RDS instance.
  #        No manual steps; entirely IAM-gated.
  # ---------------------------------------------------------------------------
  #
  # Why SSM SendCommand: RDS lives in private subnets. The GH Actions runner
  # CANNOT reach it directly. The bastion can. SSM bridges the two via the
  # AWS API (no SSH, no inbound ports, IAM-gated).
  #
  # The seed SQL files (seed/*.sql) are CHECKED IN at this repo. The seed
  # job uploads them to the bastion via S3 (the bootstrap state bucket
  # doubles as a transient drop zone for this), then SSM-runs psql.
  seed:
    name: seed
    runs-on: ubuntu-latest
    needs: apply
    # Always runs after a successful dispatched apply. No separate gate —
    # the apply dispatch itself authorized the whole flow.
    if: needs.apply.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-seed-${{ github.run_id }}

      - name: Look up runtime values
        id: lookup
        run: |
          BASTION_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=sbx-bastion-01 Name=instance-state-name,Values=running \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          STATE_BUCKET="sbx-tfstate-${{ vars.AWS_ACCOUNT_ID }}-${{ env.AWS_REGION }}"
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id sbx-rds-pg-master-credentials \
            --query ARN --output text)
          RDS_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier sbx-rds-pg \
            --query "DBInstances[0].Endpoint.Address" --output text)

          echo "bastion_id=$BASTION_ID"     >> "$GITHUB_OUTPUT"
          echo "state_bucket=$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "secret_arn=$SECRET_ARN"     >> "$GITHUB_OUTPUT"
          echo "rds_host=$RDS_HOST"         >> "$GITHUB_OUTPUT"

          echo "Bastion:     $BASTION_ID"
          echo "State bkt:   $STATE_BUCKET"
          echo "Secret ARN:  $SECRET_ARN"
          echo "RDS host:    $RDS_HOST"

      - name: Upload seed bundle to S3 (orchestrator + SQL files)
        run: |
          # Both the orchestrator and the seed scripts go to a per-run-id
          # prefix in the bootstrap state bucket. Cleaned up at the end.
          aws s3 cp seed/ \
            "s3://${{ steps.lookup.outputs.state_bucket }}/seed-drops/sbx-rds-pg-${{ github.run_id }}/" \
            --recursive --exclude "*" --include "*.sql" --include "run-seed.sh"

      - name: Run seed on bastion via SSM SendCommand
        id: ssm
        run: |
          DROP_S3="s3://${{ steps.lookup.outputs.state_bucket }}/seed-drops/sbx-rds-pg-${{ github.run_id }}/"
          REMOTE_DIR="/tmp/sbx-rds-pg-seed-${{ github.run_id }}"

          # The orchestrator script (run-seed.sh) is in the bundle; the
          # bastion just fetches the bundle, makes the script executable,
          # and runs it with the right env vars. Simpler than inlining a
          # huge JSON-escaped script.
          jq -n \
            --arg drop "$DROP_S3" \
            --arg remote "$REMOTE_DIR" \
            --arg secret "${{ steps.lookup.outputs.secret_arn }}" \
            --arg region "${{ env.AWS_REGION }}" \
            --arg host "${{ steps.lookup.outputs.rds_host }}" \
            '{
              commands: [
                "set -e",
                "rm -rf \($remote) && mkdir -p \($remote)",
                "aws s3 cp \($drop) \($remote)/ --recursive --quiet",
                "chmod +x \($remote)/run-seed.sh",
                "export RDS_HOST=\($host) SECRET_ARN=\($secret) AWS_REGION=\($region) SEED_DROP=\($remote)",
                "bash \($remote)/run-seed.sh",
                "rm -rf \($remote)"
              ],
              executionTimeout: ["1500"]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.lookup.outputs.bastion_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "sbx-rds-pg seed run-id ${{ github.run_id }}" \
            --parameters file:///tmp/ssm-params.json \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true" \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $CMD_ID"
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          # Poll for completion (max 25 min)
          for i in $(seq 1 75); do
            sleep 20
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ steps.lookup.outputs.bastion_id }}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "[t+$((i*20))s] status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Cancelled|Failed|TimedOut) echo "::error::Seed run failed: $STATUS"; exit 1 ;;
            esac
          done
          echo "::error::Seed run did not complete within 25min"
          exit 1

      - name: Print SSM stdout + stderr
        if: always()
        run: |
          echo "===== SSM stdout ====="
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.lookup.outputs.bastion_id }}" \
            --query StandardOutputContent --output text || true
          echo ""
          echo "===== SSM stderr ====="
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.lookup.outputs.bastion_id }}" \
            --query StandardErrorContent --output text || true

      - name: Cleanup S3 drop zone
        if: always()
        run: |
          aws s3 rm \
            "s3://${{ steps.lookup.outputs.state_bucket }}/seed-drops/sbx-rds-pg-${{ github.run_id }}/" \
            --recursive --quiet || true

  # ---------------------------------------------------------------------------
  # destroy — manual workflow_dispatch only
  # ---------------------------------------------------------------------------
  # `needs: plan` keeps the Actions graph connected as one continuous
  # pipeline (validate → plan → destroy). always() lets destroy run even
  # though plan is always skipped on workflow_dispatch.
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    needs: plan
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-destroy-${{ github.run_id }}

      - name: Init
        run: terraform init

      - name: Destroy
        run: terraform destroy -auto-approve
